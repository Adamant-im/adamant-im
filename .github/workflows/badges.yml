name: Update Commits Badge

on:
  # The badge counts commits on all branches; refreshing it on main-branch pushes plus daily is
  # enough, and every run adds a commit to gh-pages.
  push:
    branches:
      - dev
      - master
  schedule:
    - cron: '17 2 * * *' # every day at 02:17 UTC
  workflow_dispatch: # manual run

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to have all branches and commits

      - name: Count commits in last 30 days
        run: |
          COUNT=$(git rev-list --all --since="30 days ago" --count)
          echo "COMMITS=$COUNT" >> $GITHUB_ENV

      - name: Generate JSON for Shields.io
        run: |
          mkdir -p .badges
          COLOR="red"
          if [ $COMMITS -gt 12 ]; then COLOR="brightgreen"; fi
          cat > .badges/commits.json <<EOF
          {
            "schemaVersion": 1,
            "label": "commits/30d",
            "message": "$COMMITS",
            "color": "$COLOR"
          }
          EOF

      # gh-pages only holds badge data. Vercel deploys every branch of the project by default and
      # reads this file from the pushed commit, so it would otherwise build each badge update.
      - name: Disable Vercel deployments of the badge branch
        run: |
          echo '{ "git": { "deploymentEnabled": false } }' > .badges/vercel.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .badges
          destination_dir: .
