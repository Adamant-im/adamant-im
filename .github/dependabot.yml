version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:22'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # Keeps version updates behind the seven-day release-age gate in the Security workflow.
    # The extra day avoids proposing a version a few hours before the gate accepts it.
    # Security updates ignore the cooldown, see DEPENDENCY_SECURITY.md for that path.
    cooldown:
      default-days: 8
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:52'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci(deps)'
