# Security response headers for a self-hosted ADAMANT Messenger PWA.
#
# Mirrors PWA_SECURITY_HEADERS in vite-config/plugins/cspHardeningPlugin.ts; contract tests fail
# when the two differ. Reinstall this file whenever it changes: browsers enforce every delivered
# policy, so a stale header silently narrows the policy that ships inside each build.
#
# nginx stops inheriting add_header directives in any block that declares its own. Include this
# file in the server block and again in every location that calls add_header.
#
# Add Strict-Transport-Security in HTTPS server blocks only; it is not part of this file because
# onion services are served over plain HTTP.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' data: 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-XSS-Protection "0" always;
